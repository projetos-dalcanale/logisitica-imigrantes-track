<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LogiTrack Pro - Gestão Logística</title>

    <!-- Aplica o tema salvo (claro/escuro) ANTES de qualquer estilo carregar,
         pra tela não "piscar" no tema errado ao abrir o app. -->
    <script>
      (function () {
        try {
          if (localStorage.getItem('logitrack-theme') === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
          }
        } catch (e) {}
      })();
    </script>

    <!-- PWA: instalável no celular/desktop (ícone, tela cheia, cor do tema) -->
    <meta name="theme-color" content="#B10004" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="LogiTrack" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />

  </head>
  <body class="bg-navy-900 text-slate-300 font-sans antialiased">
    <div id="root"></div>
    <!-- Área usada só na impressão (Exportar PDF), ver index.css -->
    <div id="print-area"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
