<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LogiTrack Pro - Gestão Logística</title>

    <!-- Aplica o tema salvo (claro/escuro) ANTES de qualquer estilo carregar,
         pra tela não "piscar" no tema errado ao abrir o app. -->
    <script>
        (function () {
            try {
                if (localStorage.getItem('logitrack-theme') === 'dark') {
                    document.documentElement.setAttribute('data-theme', 'dark');
                }
            } catch (e) {}
        })();
    </script>

    <!-- PWA: instalável no celular/desktop (ícone, tela cheia, cor do tema) -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#B10004">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="LogiTrack">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <!-- SortableJS: usado para permitir arrastar e reordenar os cards de processo -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.2/Sortable.min.js"></script>
    <script>
        // Paleta baseada na assinatura de e-mail da Transportes Imigrantes
        // (vermelho da marca + cinza do logo + texto quase-preto), em tons
        // claros e suaves (sem branco puro/forte) no lugar do tema escuro
        // original. Reaproveitamos os MESMOS nomes de classe (navy-900/800/700,
        // slate-*, blue-*) só trocando os valores hex, para não precisar mexer
        // em cada elemento do app.
        //
        // Cada cor aponta pra uma variável CSS (definida logo abaixo, com um
        // valor para tema claro e outro para tema escuro) em vez de um hex
        // fixo. O "rgb(var(...) / <alpha-value>)" é o formato que o Tailwind
        // usa pra continuar funcionando com opacidade (ex: bg-blue-600/20).
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        navy: {
                            900: 'rgb(var(--navy-900) / <alpha-value>)', // fundo da página
                            800: 'rgb(var(--navy-800) / <alpha-value>)', // superfície dos cards/painéis
                            700: 'rgb(var(--navy-700) / <alpha-value>)', // preenchimento dos campos de formulário
                        },
                        slate: {
                            200: 'rgb(var(--slate-200) / <alpha-value>)', // texto secundário mais forte (ex: valor do Doc/Booking)
                            300: 'rgb(var(--slate-300) / <alpha-value>)', // texto principal do corpo
                            400: 'rgb(var(--slate-400) / <alpha-value>)', // rótulos e texto secundário
                            500: 'rgb(var(--slate-500) / <alpha-value>)', // texto/ícones apagados
                            600: 'rgb(var(--slate-600) / <alpha-value>)', // bordas de input
                            700: 'rgb(var(--slate-700) / <alpha-value>)', // bordas de cards/painéis
                        },
                        blue: { // usado como cor de destaque -> vermelho da marca
                            300: 'rgb(var(--blue-300) / <alpha-value>)',
                            400: 'rgb(var(--blue-400) / <alpha-value>)',
                            500: 'rgb(var(--blue-500) / <alpha-value>)',
                            600: 'rgb(var(--blue-600) / <alpha-value>)',
                            800: 'rgb(var(--blue-800) / <alpha-value>)',
                            900: 'rgb(var(--blue-900) / <alpha-value>)',
                        },
                        red: { 400: 'rgb(var(--red-400) / <alpha-value>)' }, // texto de erro/exclusão
                        emerald: { 400: 'rgb(var(--emerald-400) / <alpha-value>)' }, // texto de sucesso
                        yellow: { 400: 'rgb(var(--yellow-400) / <alpha-value>)', 500: 'rgb(var(--yellow-500) / <alpha-value>)' }, // texto de alertas
                        ink: 'rgb(var(--ink) / <alpha-value>)' // texto principal (escuro no tema claro, quase branco no escuro)
                    },
                    boxShadow: {
                        'apple-sm': '0 1px 2px rgb(0 0 0 / 0.04), 0 6px 18px rgb(0 0 0 / 0.07)',
                        'apple-hover': '0 4px 10px rgb(0 0 0 / 0.06), 0 20px 48px rgb(0 0 0 / 0.14)'
                    },
                    fontFamily: {
                        sans: ['-apple-system', 'BlinkMacSystemFont', 'SF Pro Text', 'SF Pro Display', 'Segoe UI', 'Roboto', 'Helvetica Neue', 'Arial', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        /* Tema CLARO (padrão) — mesmos valores de sempre, em "R G B". */
        :root {
            --navy-900: 245 245 247;
            --navy-800: 255 255 255;
            --navy-700: 229 229 234;
            --slate-200: 29 29 31;
            --slate-300: 44 44 46;
            --slate-400: 110 110 115;
            --slate-500: 142 142 147;
            --slate-600: 209 209 214;
            --slate-700: 229 229 234;
            --blue-300: 155 10 16;
            --blue-400: 198 8 12;
            --blue-500: 215 28 34;
            --blue-600: 177 0 4;
            --blue-800: 178 50 57;
            --blue-900: 122 2 9;
            --red-400: 200 39 45;
            --emerald-400: 11 125 84;
            --yellow-400: 146 64 14;
            --yellow-500: 180 83 9;
            --ink: 29 29 31;
            --seg-thumb: 255 255 255;
        }

        /* Tema ESCURO — ativado adicionando data-theme="dark" na tag <html>
           (o botão de alternar tema faz isso). Mesma paleta de destaque
           (vermelho da marca), só que sobre um fundo navy escuro. */
        :root[data-theme="dark"] {
            --navy-900: 22 22 24;
            --navy-800: 38 38 42;
            --navy-700: 56 56 60;
            --slate-200: 242 242 247;
            --slate-300: 229 229 234;
            --slate-400: 168 168 174;
            --slate-500: 142 142 147;
            --slate-600: 84 84 90;
            --slate-700: 60 60 64;
            --blue-300: 255 120 114;
            --blue-400: 255 69 58;
            --blue-500: 255 84 74;
            --blue-600: 235 45 40;
            --blue-800: 158 42 38;
            --blue-900: 118 22 20;
            --red-400: 255 105 110;
            --emerald-400: 48 209 88;
            --yellow-400: 255 214 10;
            --yellow-500: 255 204 0;
            --ink: 245 245 247;
            --seg-thumb: 108 108 114;
        }

        /* Transição suave ao alternar entre tema claro/escuro: em vez da cor
           de fundo/texto/borda mudar de uma vez, desliza suavemente entre os
           dois tons. @media (prefers-reduced-motion) mais abaixo já zera a
           duração pra quem prefere menos animação na tela. */
        *, *::before, *::after {
            transition-property: background-color, border-color, color, fill, stroke, box-shadow;
            transition-duration: .25s;
            transition-timing-function: ease;
        }

        /* Toasts de feedback rápido (ex: "Processo criado com sucesso"),
           mostrados no canto inferior direito da tela. */
        .toast-item {
            pointer-events: auto;
            opacity: 0;
            transform: translateY(10px);
            transition: opacity .25s ease, transform .25s ease;
        }
        .toast-item.toast-in {
            opacity: 1;
            transform: translateY(0);
        }
        .toast-item.toast-out {
            opacity: 0;
            transform: translateY(-6px);
        }

        /* ------------------------------------------------------------------
           SKIN "APPLE": componentes com acabamento estilo macOS/iOS.
           Card branco com sombra difusa, campos "preenchidos" sem borda,
           controle segmentado, modal com vidro fosco e cantos bem abertos.
           ------------------------------------------------------------------ */

        ::selection { background: rgb(var(--blue-500) / .22); }

        body { -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }

        h1, h2, h3 { letter-spacing: -0.02em; }

        /* Superfície de card: fundo branco (ou cinza elevado no escuro),
           cantos generosos e sombra suave em duas camadas. */
        .apple-card {
            background: rgb(var(--navy-800));
            border-radius: 20px;
            box-shadow: 0 1px 2px rgb(0 0 0 / .04), 0 8px 24px rgb(0 0 0 / .06);
        }

        /* Superfície "afundada" (o cinza agrupado do iOS): fundo do próprio
           fundo da página, com uma sombra interna discreta. */
        .apple-inset {
            background: rgb(var(--navy-900) / .72);
            box-shadow: inset 0 1px 2px rgb(0 0 0 / .04);
        }

        .apple-modal-panel {
            border-radius: 22px;
            box-shadow: 0 30px 90px rgb(0 0 0 / .30), 0 8px 24px rgb(0 0 0 / .12);
        }

        /* Campos "filled" (iOS): bloco cinza arredondado sem borda; no foco
           ganha anel colorido suave, como o foco de formulário da Apple. */
        .apple-input {
            width: 100%;
            background-color: rgb(var(--navy-700) / .55);
            border: 1px solid transparent;
            border-radius: 10px;
            padding: 9px 12px;
            font-size: 13.5px;
            color: rgb(var(--ink));
            outline: none;
            transition: background-color .18s ease, border-color .18s ease, box-shadow .18s ease;
        }
        .apple-input::placeholder { color: rgb(var(--slate-500)); }
        .apple-input:hover:not(:disabled) { border-color: rgb(var(--slate-600)); }
        .apple-input:focus {
            background-color: rgb(var(--navy-800));
            border-color: rgb(var(--blue-500));
            box-shadow: 0 0 0 3.5px rgb(var(--blue-500) / .16);
        }
        .apple-input:disabled { opacity: .55; }

        .apple-input-sm {
            background-color: rgb(var(--navy-700) / .55);
            border: 1px solid transparent;
            border-radius: 8px;
            padding: 6px 10px;
            font-size: 12px;
            color: rgb(var(--ink));
            outline: none;
            transition: background-color .18s ease, border-color .18s ease, box-shadow .18s ease;
        }
        .apple-input-sm:focus {
            background-color: rgb(var(--navy-800));
            border-color: rgb(var(--blue-500));
            box-shadow: 0 0 0 3px rgb(var(--blue-500) / .16);
        }

        .apple-check {
            width: 17px;
            height: 17px;
            border-radius: 5px;
            accent-color: rgb(var(--blue-500));
        }

        /* Botão primário: pill da cor da marca com sombra colorida suave,
           leve zoom ao apertar (feedback tátil do iOS). */
        .apple-btn-primary {
            background: rgb(var(--blue-600));
            color: #fff;
            font-weight: 600;
            border-radius: 12px;
            box-shadow: 0 1px 2px rgb(0 0 0 / .12), 0 6px 18px rgb(var(--blue-600) / .30);
            transition: transform .15s ease, filter .15s ease, box-shadow .2s ease;
        }
        .apple-btn-primary:hover { filter: brightness(1.09); box-shadow: 0 2px 4px rgb(0 0 0 / .12), 0 8px 24px rgb(var(--blue-600) / .38); }
        .apple-btn-primary:active { transform: scale(.97); }

        /* Botão secundário: pill cinza sutil, sem borda (estilo dos botões
           de ação dos diálogos da Apple). */
        .apple-btn-secondary {
            background: rgb(var(--slate-500) / .12);
            color: rgb(var(--ink));
            font-weight: 600;
            border-radius: 12px;
            transition: transform .15s ease, background-color .15s ease;
        }
        .apple-btn-secondary:hover { background: rgb(var(--slate-500) / .20); }
        .apple-btn-secondary:active { transform: scale(.97); }

        /* Controle segmentado (iOS): trilho cinza + "thumb" que desliza
           entre Importação/Exportação e entre as listas de cadastros. */
        .apple-seg {
            display: flex;
            gap: 2px;
            padding: 2px;
            border-radius: 11px;
            background: rgb(var(--navy-700) / .55);
            box-shadow: inset 0 1px 2px rgb(0 0 0 / .05);
        }
        .seg-on {
            background: rgb(var(--seg-thumb));
            color: rgb(var(--ink));
            box-shadow: 0 1px 3px rgb(0 0 0 / .14), 0 0 0 .5px rgb(0 0 0 / .05);
        }
        .seg-off { color: rgb(var(--slate-400)); }
        .seg-off:hover { color: rgb(var(--ink)); }

        /* Rótulos do formulário lateral em caps pequenas, no ritmo tipográfico
           da Apple (_SF Pro pequeno e espaçado_). */
        #sidebar label {
            display: block;
            font-size: 10.5px;
            font-weight: 600;
            letter-spacing: .08em;
            text-transform: uppercase;
            color: rgb(var(--slate-400));
            margin-bottom: 6px;
        }

        /* Linha de item (checklist de agendamento) dentro do modal. */
        .apple-field-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 12px 14px;
            border-radius: 12px;
            background: rgb(var(--navy-800) / .6);
            border: 1px solid rgb(var(--slate-700) / .9);
            font-size: 13.5px;
            color: rgb(var(--slate-300));
            transition: background-color .15s ease, border-color .15s ease;
        }

        /* Toast: pill de vidro fosco, como os banners do sistema. */
        .apple-toast {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 16px;
            border-radius: 14px;
            background: rgb(var(--navy-800) / .88);
            backdrop-filter: blur(20px) saturate(1.6);
            -webkit-backdrop-filter: blur(20px) saturate(1.6);
            border: 1px solid rgb(var(--slate-600) / .55);
            box-shadow: 0 12px 32px rgb(0 0 0 / .16), 0 2px 8px rgb(0 0 0 / .08);
            font-size: 13px;
            font-weight: 600;
            color: rgb(var(--ink));
        }
    </style>
</head>
<body class="bg-navy-900 text-slate-300 font-sans antialiased h-screen flex overflow-hidden">

    <!-- TELA DE LOGIN -->
    <div id="login-screen" class="fixed inset-0 bg-navy-900 flex items-center justify-center z-50 overflow-hidden px-4">
        <div class="pointer-events-none absolute -top-32 -left-24 w-[28rem] h-[28rem] rounded-full bg-blue-600/15 blur-3xl"></div>
        <div class="pointer-events-none absolute -bottom-32 -right-24 w-[28rem] h-[28rem] rounded-full bg-blue-600/15 blur-3xl"></div>
        <div class="relative apple-card w-full max-w-sm p-8">
            <div class="flex flex-col items-center text-center mb-7">
                <div class="w-14 h-14 rounded-2xl bg-gradient-to-b from-blue-500/15 to-blue-600/5 border border-blue-800/50 flex items-center justify-center mb-4 shadow-sm">
                    <i class="fas fa-truck-fast text-blue-500 text-xl"></i>
                </div>
                <h2 class="text-[22px] font-bold text-ink tracking-tight">LogiTrack</h2>
                <p class="text-[11px] text-slate-500 font-medium uppercase tracking-[0.14em] mt-1">Gestão Logística</p>
            </div>
            <form id="login-form" class="space-y-4">
                <div>
                    <label>E-mail</label>
                    <div class="relative">
                        <i class="fas fa-envelope absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-500 text-xs"></i>
                        <input type="email" id="auth-email" required class="apple-input pl-9">
                    </div>
                </div>
                <div>
                    <label>Senha</label>
                    <div class="relative">
                        <i class="fas fa-lock absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-500 text-xs"></i>
                        <input type="password" id="auth-password" required minlength="6" autocomplete="current-password" class="apple-input pl-9">
                    </div>
                </div>
                <div class="text-red-400 text-[13px] font-medium hidden bg-red-500/10 p-3 rounded-xl" id="auth-error"></div>
                <button type="submit" id="btn-login" class="apple-btn-primary w-full p-3 text-[15px]">Entrar</button>
                <p class="text-xs text-slate-500 text-center pt-2 flex items-center justify-center gap-1.5"><i class="fas fa-shield-halved text-slate-500/70"></i>Acesso restrito a contas criadas pelo administrador.</p>
            </form>
        </div>
    </div>

    <!-- SIDEBAR / FORMULÁRIO DE CRIAÇÃO -->
    <aside class="fixed inset-y-0 left-0 z-40 w-[340px] max-w-[85vw] -translate-x-full transition-transform duration-300 ease-out lg:static lg:z-auto lg:translate-x-0 bg-navy-800 shadow-2xl flex flex-col h-full border-r border-slate-700/60 hidden" id="sidebar">
        <div class="p-5 border-b border-slate-700/70 flex justify-between items-center bg-navy-800">
            <div class="flex items-center gap-2.5">
                <div class="w-8 h-8 rounded-[10px] bg-gradient-to-b from-blue-500/20 to-blue-600/5 border border-blue-800/50 flex items-center justify-center shadow-sm">
                    <i class="fas fa-truck-fast text-blue-500 text-sm"></i>
                </div>
                <h1 class="text-base font-semibold text-ink tracking-tight">LogiTrack</h1>
            </div>
            <div class="flex items-center gap-1">
                <button id="btn-close-sidebar" onclick="closeSidebarMobile()" title="Fechar menu" class="lg:hidden w-8 h-8 rounded-lg text-slate-400 hover:text-ink hover:bg-slate-500/10 transition flex items-center justify-center"><i class="fas fa-xmark text-sm"></i></button>
                <button id="btn-logout" title="Sair" class="w-8 h-8 rounded-lg text-slate-400 hover:text-red-400 hover:bg-red-500/10 transition flex items-center justify-center"><i class="fas fa-sign-out-alt text-sm"></i></button>
            </div>
        </div>

        <div class="p-6 overflow-y-auto flex-1 ios-scroll">
            <h2 class="text-[11px] font-semibold mb-4 text-slate-500 uppercase tracking-[0.12em]">Novo Processo</h2>

            <div class="apple-seg mb-6">
                <button id="btn-type-import" class="flex-1 py-[7px] text-[13px] font-semibold rounded-[9px] seg-on transition-all duration-200">Importação</button>
                <button id="btn-type-export" class="flex-1 py-[7px] text-[13px] font-semibold rounded-[9px] seg-off transition-all duration-200">Exportação</button>
            </div>

            <form id="process-form" class="space-y-4">
                <input type="hidden" id="process-type" value="import">
                
                <!-- Armador (comum a importação e exportação) -->
                <div id="fields-common-armador" class="space-y-4">
                    <div>
                        <label>Armador</label>
                        <select id="f-armador" onchange="handleArmadorSelectForm(this)" class="apple-input" required>
                            <option value="">Selecione...</option>
                        </select>
                    </div>
                </div>

                <!-- Campos Importação: Importador / Documento -->
                <div id="fields-import-doc" class="space-y-4">
                    <div>
                        <label>Importador</label>
                        <input type="text" id="f-importador" maxlength="150" class="apple-input">
                    </div>
                    <div>
                        <label>DI / DTA / DUIMP</label>
                        <div class="flex gap-2">
                            <select id="f-documento-tipo" class="apple-input w-28">
                                <option value="">Tipo</option>
                                <option value="DI">DI</option>
                                <option value="DTA">DTA</option>
                                <option value="DUIMP">DUIMP</option>
                            </select>
                            <input type="text" id="f-documento-numero" maxlength="150" placeholder="Número do documento" class="apple-input flex-1">
                        </div>
                    </div>
                </div>

                <!-- Campos Exportação -->
                <div id="fields-export" class="space-y-4 hidden">
                    <div>
                        <label>Exportador</label>
                        <input type="text" id="f-exportador" maxlength="150" class="apple-input">
                    </div>
                    <div>
                        <label>Referência do Processo</label>
                        <input type="text" id="f-referencia" maxlength="150" class="apple-input">
                    </div>
                    <div>
                        <label>Número do Booking</label>
                        <input type="text" id="f-booking" maxlength="150" class="apple-input">
                    </div>
                    <div>
                        <label>Nome do Navio</label>
                        <input type="text" id="f-navio" maxlength="150" class="apple-input">
                    </div>
                </div>

                <!-- Motorista / Placas (comum a importação e exportação) -->
                <div id="fields-common-driver" class="space-y-4">
                    <div>
                        <label>Motorista</label>
                        <input type="text" id="f-motorista" maxlength="150" class="apple-input">
                    </div>
                    <div>
                        <label>Placas do Caminhão</label>
                        <input type="text" id="f-placas" maxlength="150" placeholder="Ex: ABC1D23 e XYZ9F87" class="apple-input">
                    </div>
                    <div>
                        <label>Observações</label>
                        <textarea id="f-observacoes" maxlength="1000" rows="2" placeholder="Recados rápidos para a equipe (opcional)" class="apple-input resize-none"></textarea>
                    </div>
                </div>

                <!-- Campos Importação: Terminais -->
                <div id="fields-import-terminals" class="space-y-4">
                    <div>
                        <label>Terminal de Carregamento</label>
                        <select id="f-term-carga" onchange="handleTerminalSelectForm(this, 'cheio')" class="apple-input">
                            <option value="">Selecione...</option>
                        </select>
                    </div>
                    <div>
                        <label>Terminal de Vazio</label>
                        <select id="f-term-vazio" onchange="handleTerminalSelectForm(this, 'vazio')" class="apple-input">
                            <option value="">Selecione...</option>
                        </select>
                    </div>
                    <div>
                        <label>Destino do Contêiner</label>
                        <select id="f-finalizacao-vazio" class="apple-input">
                            <option value="devolucao">Devolução de Vazio</option>
                            <option value="baixa">Baixa de Contêiner (sem devolução)</option>
                        </select>
                    </div>
                </div>

                <div class="border-t border-slate-700/70 pt-5 mt-5">
                    <h3 class="text-sm font-semibold text-ink mb-2 flex justify-between items-center tracking-tight">
                        Contêineres Iniciais
                        <button type="button" id="btn-add-container" class="text-blue-500 hover:text-blue-400 text-xs font-semibold transition flex items-center gap-1"><i class="fas fa-plus text-[10px]"></i> Adicionar</button>
                    </h3>
                    <p class="text-xs text-slate-500 mb-3 leading-relaxed">Opcional: você pode adicionar ou editar contêineres e lacres depois, abrindo o processo.</p>
                    <div id="container-list" class="space-y-3">
                        <!-- Containers inseridos dinamicamente -->
                    </div>
                </div>

                <button type="submit" class="apple-btn-primary w-full py-3 text-[15px] mt-8">Criar Processo</button>
            </form>
        </div>
    </aside>

    <!-- Fundo escurecido atrás do menu lateral, só aparece no celular -->
    <div id="sidebar-backdrop" onclick="closeSidebarMobile()" class="hidden fixed inset-0 bg-black/50 z-30 lg:hidden"></div>

    <!-- PAINEL PRINCIPAL -->
    <main class="flex-1 flex flex-col h-full hidden min-w-0" id="main-panel">
        <header class="bg-navy-800/80 backdrop-blur-xl shadow-sm border-b border-slate-700/60 px-4 sm:px-8 py-3 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
            <div class="flex items-center gap-3 min-w-0">

    <!-- MODAL DE DETALHES -->
    <div id="process-modal" class="fixed inset-0 bg-black/45 backdrop-blur-md hidden items-center justify-center z-50 p-4">

    <!-- MODAL: GERENCIAR CADASTROS (editar/excluir terminais, armador, tipo

                <button onclick="closeRegistriesModal()" title="Fechar" class="w-9 h-9 rounded-full text-slate-500 hover:text-ink hover:bg-slate-500/10 text-xl transition flex items-center justify-center">&times;</button>

                <button class="registry-tab-btn flex-1 min-w-fit px-3 py-[7px] text-[12px] font-semibold rounded-[9px] seg-off transition-all duration-200" data-cat="vazio" onclick="switchRegistryTab('vazio')">Vazio</button>

                <button class="registry-tab-btn flex-1 min-w-fit px-3 py-[7px] text-[12px] font-semibold rounded-[9px] seg-off transition-all duration-200" data-cat="tipo" onclick="switchRegistryTab('tipo')">Tipo</button>
