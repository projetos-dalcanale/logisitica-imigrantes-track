    <!-- Área usada só na hora de exportar um processo em PDF: fica escondida
         na tela normal e só aparece quando o navegador entra em modo de
         impressão (Ctrl+P / "Salvar como PDF"), via CSS no final do arquivo. -->
    <div id="print-area"></div>

    <!-- Container das notificações rápidas (toasts) de feedback de ações,
         tipo "Processo criado com sucesso". Fica sempre no canto da tela,
         acima de tudo, e cada toast some sozinho depois de alguns segundos. -->
    <div id="toast-container" class="fixed bottom-5 right-5 z-[100] flex flex-col gap-2.5 items-end pointer-events-none max-w-[calc(100vw-2rem)]"></div>

    <!-- Firebase SDKs e Lógica -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, query, where, onSnapshot, doc, updateDoc, deleteDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAKGjOftcyDZ-5yPA-5NK55GohtGlrfbeQ",
            authDomain: "track-logistica.firebaseapp.com",
            projectId: "track-logistica",
            storageBucket: "track-logistica.firebasestorage.app",
            messagingSenderId: "986198520521",
            appId: "1:986198520521:web:a4c088bc7c4e773156d318"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUser = null;
        let currentActiveTab = 'import';
        let processes = [];
        let currentViewingProcessId = null;
        let searchQuery = ''; // busca rápida (armador, motorista, placa, doc/booking, nº do contêiner)

        // Lista de terminais pré-cadastrados, compartilhada com toda a equipe
        // (documento único em config/terminals). "cheio" = terminais onde se
        // pega/deposita contêiner cheio (Terminal de Carregamento / Depósito
        // Cheio); "vazio" = terminais de devolução/retirada de vazio.
        let terminaisCadastrados = { vazio: [], cheio: [] };

        // Lista de armadores pré-cadastrados, compartilhada com toda a equipe
        // (documento único em config/armadores).
        let armadoresCadastrados = [];

        // Lista de tipos de contêiner pré-cadastrados (ex: 20DC, 40HC),
        // compartilhada com toda a equipe (documento único em config/tipos).
        let tiposCadastrados = [];

        const loginScreen = document.getElementById('login-screen');
        const sidebar = document.getElementById('sidebar');
        const mainPanel = document.getElementById('main-panel');

        // MENU LATERAL NO CELULAR: em telas grandes (lg+) o menu fica sempre
        // visível ao lado (comportamento original, inalterado); em telas
        // pequenas ele some por padrão e é aberto/fechado como uma gaveta
        // (via botão de hambúrguer no cabeçalho, X no menu, ou tocando no
        // fundo escurecido).
        window.openSidebarMobile = () => {
            sidebar.classList.remove('-translate-x-full');
            sidebar.classList.add('translate-x-0');
            document.getElementById('sidebar-backdrop').classList.remove('hidden');
        };
        window.closeSidebarMobile = () => {
            sidebar.classList.add('-translate-x-full');
            sidebar.classList.remove('translate-x-0');
            document.getElementById('sidebar-backdrop').classList.add('hidden');
        };

        // MODO ESCURO (opcional, fica salvo no navegador de cada pessoa)
        const applyThemeIcon = () => {
            const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
            const icon = document.querySelector('#btn-toggle-theme i');
            if (icon) icon.className = isDark ? 'fas fa-sun text-sm' : 'fas fa-moon text-sm';
        };
        window.toggleTheme = () => {
            const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
            if (isDark) {
                document.documentElement.removeAttribute('data-theme');
                localStorage.setItem('logitrack-theme', 'light');
            } else {
                document.documentElement.setAttribute('data-theme', 'dark');
                localStorage.setItem('logitrack-theme', 'dark');
            }
            applyThemeIcon();
        };
        applyThemeIcon(); // reflete no ícone o tema já aplicado (definido no script do head)

        // SEGURANÇA: escapa qualquer valor antes de inseri-lo via innerHTML,
        // impedindo que texto digitado pelo usuário (armador, número de contêiner,
        // e-mail, etc.) seja interpretado como HTML/JS (XSS armazenado).
        const escapeHtml = (value) => {
            if (value === null || value === undefined) return '';
            return String(value)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        };

        // NOTIFICAÇÕES RÁPIDAS (TOAST): feedback visual curto depois de uma
        // ação (criar processo, arquivar, excluir, remover contêiner), pra
        // confirmar que realmente aconteceu, sem precisar de um alert() que
        // interrompe o uso. Some sozinho depois de alguns segundos.
        const TOAST_STYLES = {
            success: { icon: 'fa-circle-check', classes: 'text-emerald-500' },
            error:   { icon: 'fa-circle-exclamation', classes: 'text-red-400' },
            info:    { icon: 'fa-circle-info', classes: 'text-blue-500' }
        };
        const showToast = (message, type = 'success') => {
            const container = document.getElementById('toast-container');
            if (!container) return;
            const cfg = TOAST_STYLES[type] || TOAST_STYLES.success;
            const el = document.createElement('div');
            el.className = `toast-item apple-toast ${cfg.classes}`;
            el.innerHTML = `<i class="fas ${cfg.icon}"></i><span>${escapeHtml(message)}</span>`;
            container.appendChild(el);
            requestAnimationFrame(() => el.classList.add('toast-in'));
            setTimeout(() => {
                el.classList.remove('toast-in');
                el.classList.add('toast-out');
                setTimeout(() => el.remove(), 300);
            }, 3200);
        };

        // Converte o valor de um <input type="datetime-local"> (ex:
        // "2026-09-20T14:30") pro formato usado no dia a dia (dd/mm/aaaa hh:mm).
        const formatarDataHora = (valor) => {
            if (!valor) return '—';
            const data = new Date(valor);
            if (isNaN(data.getTime())) return '—';
            const pad = (n) => String(n).padStart(2, '0');
            return `${pad(data.getDate())}/${pad(data.getMonth() + 1)}/${data.getFullYear()} ${pad(data.getHours())}:${pad(data.getMinutes())}`;
        };

        // Versão compacta (sem ano), usada no card da tela principal onde o
        // espaço é mais apertado. Retorna null se não houver data válida, pra
        // quem chamar decidir se mostra alguma coisa no lugar ou nada.
        const formatarDataHoraCurta = (valor) => {
            if (!valor) return null;
            const data = new Date(valor);
            if (isNaN(data.getTime())) return null;
            const pad = (n) => String(n).padStart(2, '0');
            return `${pad(data.getDate())}/${pad(data.getMonth() + 1)} ${pad(data.getHours())}:${pad(data.getMinutes())}`;
        };

        // ORDEM PERSONALIZADA DOS CARDS (arrastar para reordenar). Fica salva
        // só neste navegador (localStorage) — é uma preferência pessoal, não
        // é compartilhada com o resto da equipe.
        let cardSortable = null; // instância do SortableJS ativa no momento, se houver

        const getCardOrder = () => {
            try {
                const raw = localStorage.getItem('logitrack-card-order');
                const arr = raw ? JSON.parse(raw) : [];
                return Array.isArray(arr) ? arr : [];
            } catch (e) {
                return [];
            }
        };

        // Lê a ordem atual dos cards no DOM (depois de um drag) e salva.
        // Ids que já estavam guardados mas não aparecem nesta tela (ex: de
        // outra aba) são mantidos no fim, preservando a posição deles.
        const saveCardOrderFromContainer = (container) => {
            const idsNaTela = Array.from(container.children)
                .map(el => el.dataset.processId)
                .filter(Boolean);
            const resto = getCardOrder().filter(id => !idsNaTela.includes(id));
            try {
                localStorage.setItem('logitrack-card-order', JSON.stringify([...idsNaTela, ...resto]));
            } catch (e) {}
        };

        // TABELA DE VALORES DO DÍGITO VERIFICADOR (norma ISO 6346), usada para
        // conferir se a numeração do contêiner foi digitada corretamente. Cada
        // letra recebe um valor de 10 a 38, pulando de propósito os múltiplos
        // de 11 (11, 22, 33).
        const isoLetterValues = {};
        (() => {
            let v = 10;
            for (const letra of 'ABCDEFGHIJKLMNOPQRSTUVWXYZ') {
                while (v % 11 === 0) v++;
                isoLetterValues[letra] = v;
                v++;
            }
        })();

        // Calcula o dígito verificador esperado (0-9) a partir dos 4 letras +
        // 6 primeiros dígitos de uma numeração de contêiner (norma ISO 6346).
        const calcularDigitoVerificador = (dezCaracteres) => {
            let soma = 0;
            for (let i = 0; i < 10; i++) {
                const c = dezCaracteres[i];
                const valor = /[0-9]/.test(c) ? parseInt(c, 10) : isoLetterValues[c];
                soma += valor * Math.pow(2, i);
            }
            const resto = soma % 11;
            return resto === 10 ? 0 : resto;
        };

        // Confere se a numeração (formatada ou não) tem o dígito verificador
        // correto. Só avalia quando os 11 caracteres (4 letras + 7 dígitos) já
        // foram digitados — retorna null enquanto o número estiver incompleto,
        // pra não incomodar a pessoa ainda digitando.
        const validarNumeroContainer = (valor) => {
            const clean = (valor || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
            const letters = (clean.match(/[A-Z]/g) || []).join('');
            const digits = (clean.match(/[0-9]/g) || []).join('');
            if (letters.length !== 4 || digits.length !== 7) return null;
            const esperado = calcularDigitoVerificador(letters + digits.slice(0, 6));
            const digitado = parseInt(digits[6], 10);
            return esperado === digitado;
        };

        // Formata a numeração do contêiner em tempo real no padrão
        // "ABCD 123.456-7" (4 letras + espaço + 3 dígitos + ponto + 3 dígitos +
        // traço + dígito verificador), aceitando colagem fora de ordem, e avisa
        // quando o dígito verificador não confere (possível erro de digitação).
        window.maskContainerNumero = (inputEl) => {
            const clean = (inputEl.value || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
            const letters = (clean.match(/[A-Z]/g) || []).slice(0, 4).join('');
            const digits = (clean.match(/[0-9]/g) || []).slice(0, 7).join('');
            let out = letters;
            if (digits.length > 0) out += ' ' + digits.slice(0, 3);
            if (digits.length > 3) out += '.' + digits.slice(3, 6);
            if (digits.length > 6) out += '-' + digits.slice(6, 7);
            inputEl.value = out;

            const warnEl = inputEl.parentElement ? inputEl.parentElement.querySelector('.ct-num-warning') : null;
            if (warnEl) {
                warnEl.classList.toggle('hidden', validarNumeroContainer(out) !== false);
            }
        };

        // CHECKLIST ORDER IMPORT (Exatamente como solicitado)
        const importChecklistSteps = [
            { id: 'ag_carga', label: 'Agendamento de Carregamento', type: 'datetime' },
            { id: 'gerar_cte', label: 'Gerar CTe', type: 'checkbox' },
            { id: 'gerar_ciot', label: 'Gerar CIOT', type: 'checkbox' },
            { id: 'gerar_mdfe', label: 'Gerar MDFE', type: 'checkbox' },
            { id: 'encerrar_mdfe', label: 'Encerrar MDFE', type: 'checkbox' },
            { id: 'ag_vazio', label: 'Agendamento de Vazio', type: 'datetime' }
        ];

        // Quando o processo é "Baixa de Contêiner" (sem devolução ao terminal),
        // a etapa de Agendamento de Vazio não se aplica — nem aparece no
        // checklist, nem conta na barra de progresso ou no PDF. Processos
        // antigos (sem o campo finalizacaoVazio) continuam se comportando como
        // "Devolução de Vazio", que é o padrão.
        const stepsChecklistImport = (proc) => {
            if (proc && proc.finalizacaoVazio === 'baixa') {
                return importChecklistSteps.filter(step => step.id !== 'ag_vazio');
            }
            return importChecklistSteps;
        };

        // Monta um objeto de checklist "zerado" para um novo contêiner de importação.
        // Para cada etapa do tipo datetime, além do valor da data/hora, criamos um
        // campo extra "<id>_check" (booleano em string) usado só para marcar que
        // aquele agendamento já foi confirmado — é o que alimenta a barra de progresso.
        const novoChecklistImport = () => {
            const checklist = {};
            importChecklistSteps.forEach(step => {
                checklist[step.id] = '';
                if (step.type === 'datetime') checklist[`${step.id}_check`] = '';
            });
            return checklist;
        };

        // TERMINAIS PRÉ-CADASTRADOS (lista compartilhada com a equipe)
        const buildTerminalOptions = (categoria, valorSelecionado) => {
            const lista = terminaisCadastrados[categoria] || [];
            let html = `<option value="">Selecione...</option>`;
            lista.forEach(nome => {
                const selecionado = nome === valorSelecionado ? 'selected' : '';
                html += `<option value="${escapeHtml(nome)}" ${selecionado}>${escapeHtml(nome)}</option>`;
            });
            // Se o valor salvo não está (mais) na lista cadastrada (ex.: dado antigo
            // digitado como texto livre antes dessa mudança), mostra mesmo assim.
            if (valorSelecionado && !lista.includes(valorSelecionado)) {
                html += `<option value="${escapeHtml(valorSelecionado)}" selected>${escapeHtml(valorSelecionado)} (não cadastrado)</option>`;
            }
            html += `<option value="__novo__">+ Adicionar novo terminal...</option>`;
            return html;
        };

        // Redesenha os dois selects de terminal do formulário lateral (Novo Processo),
        // preservando o valor já escolhido.
        const renderTerminalSelectsInSidebar = () => {
            const selCarga = document.getElementById('f-term-carga');
            const selVazio = document.getElementById('f-term-vazio');
            if (selCarga) {
                const atual = selCarga.value === '__novo__' ? '' : selCarga.value;
                selCarga.innerHTML = buildTerminalOptions('cheio', atual);
            }
            if (selVazio) {
                const atual = selVazio.value === '__novo__' ? '' : selVazio.value;
                selVazio.innerHTML = buildTerminalOptions('vazio', atual);
            }
        };

        // Carrega/observa em tempo real a lista compartilhada de terminais.
        const loadTerminais = () => {
            const ref = doc(db, "config", "terminals");
            onSnapshot(ref, (snap) => {
                const data = snap.exists() ? snap.data() : {};
                terminaisCadastrados.vazio = data.vazio || [];
                terminaisCadastrados.cheio = data.cheio || [];
                renderTerminalSelectsInSidebar();
                if (currentViewingProcessId) {
                    const proc = processes.find(p => p.id === currentViewingProcessId);
                    if (proc) renderModalContent(proc);
                }
                renderRegistryList();
            });
        };

        // Pede o nome do novo terminal e adiciona na lista compartilhada (sem duplicar).
        // Retorna o nome adicionado, ou null se o usuário cancelou.
        window.adicionarNovoTerminal = async (categoria) => {
            const rotulo = categoria === 'vazio' ? 'Vazio' : 'Cheio';
            const nome = prompt(`Nome do novo terminal (${rotulo}):`);
            if (!nome || !nome.trim()) return null;
            const nomeLimpo = nome.trim().slice(0, 150);
            const atual = terminaisCadastrados[categoria] || [];
            if (!atual.includes(nomeLimpo)) {
                const novaLista = [...atual, nomeLimpo].sort((a, b) => a.localeCompare(b, 'pt-BR'));
                const ref = doc(db, "config", "terminals");
                await setDoc(ref, { [categoria]: novaLista }, { merge: true });
            }
            return nomeLimpo;
        };

        // onchange dos selects de terminal do formulário lateral (novo processo).
        window.handleTerminalSelectForm = async (selectEl, categoria) => {
            if (selectEl.value === '__novo__') {
                const novoNome = await window.adicionarNovoTerminal(categoria);
                renderTerminalSelectsInSidebar();
                const el = document.getElementById(selectEl.id);
                if (el) el.value = novoNome || '';
            }
        };

        // onchange dos selects de terminal dentro do modal (contêineres de exportação).
        window.handleTerminalSelect = async (selectEl, procId, ctId, field, categoria) => {
            if (selectEl.value === '__novo__') {
                const novoNome = await window.adicionarNovoTerminal(categoria);
                if (novoNome) {
                    await updateField(procId, ctId, field, novoNome);
                } else {
                    const proc = processes.find(p => p.id === procId);
                    if (proc) renderModalContent(proc);
                }
            } else {
                await updateField(procId, ctId, field, selectEl.value);
            }
        };

        // ARMADORES PRÉ-CADASTRADOS (lista compartilhada com a equipe)
        const buildArmadorOptions = (valorSelecionado) => {
            const lista = armadoresCadastrados || [];
            let html = `<option value="">Selecione...</option>`;
            lista.forEach(nome => {
                const selecionado = nome === valorSelecionado ? 'selected' : '';
                html += `<option value="${escapeHtml(nome)}" ${selecionado}>${escapeHtml(nome)}</option>`;
            });
            // Se o valor salvo não está (mais) na lista cadastrada (ex.: dado antigo
            // digitado como texto livre antes dessa mudança), mostra mesmo assim.
            if (valorSelecionado && !lista.includes(valorSelecionado)) {
                html += `<option value="${escapeHtml(valorSelecionado)}" selected>${escapeHtml(valorSelecionado)} (não cadastrado)</option>`;
            }
            html += `<option value="__novo__">+ Adicionar novo armador...</option>`;
            return html;
        };

        // Redesenha o select de armador do formulário lateral (Novo Processo),
        // preservando o valor já escolhido.
        const renderArmadorSelectInSidebar = () => {
            const selArmador = document.getElementById('f-armador');
            if (selArmador) {
                const atual = selArmador.value === '__novo__' ? '' : selArmador.value;
                selArmador.innerHTML = buildArmadorOptions(atual);
            }
        };

        // Carrega/observa em tempo real a lista compartilhada de armadores.
        const loadArmadores = () => {
            const ref = doc(db, "config", "armadores");
            onSnapshot(ref, (snap) => {
                const data = snap.exists() ? snap.data() : {};
                armadoresCadastrados = data.lista || [];
                renderArmadorSelectInSidebar();
                if (currentViewingProcessId) {
                    const proc = processes.find(p => p.id === currentViewingProcessId);
                    if (proc) renderModalContent(proc);
                }
                renderRegistryList();
            });
        };

        // Pede o nome do novo armador e adiciona na lista compartilhada (sem duplicar).
        // Retorna o nome adicionado, ou null se o usuário cancelou.
        window.adicionarNovoArmador = async () => {
            const nome = prompt('Nome do novo armador:');
            if (!nome || !nome.trim()) return null;
            const nomeLimpo = nome.trim().slice(0, 150);
            const atual = armadoresCadastrados || [];
            if (!atual.includes(nomeLimpo)) {
                const novaLista = [...atual, nomeLimpo].sort((a, b) => a.localeCompare(b, 'pt-BR'));
                const ref = doc(db, "config", "armadores");
                await setDoc(ref, { lista: novaLista }, { merge: true });
            }
            return nomeLimpo;
        };

        // onchange do select de armador do formulário lateral (novo processo).
        window.handleArmadorSelectForm = async (selectEl) => {
            if (selectEl.value === '__novo__') {
                const novoNome = await window.adicionarNovoArmador();
                renderArmadorSelectInSidebar();
                const el = document.getElementById(selectEl.id);
                if (el) el.value = novoNome || '';
            }
        };

        // TIPOS DE CONTÊINER PRÉ-CADASTRADOS (lista compartilhada com a equipe)
        const buildTipoOptions = (valorSelecionado) => {
            const lista = tiposCadastrados || [];
            let html = `<option value="">Selecione...</option>`;
            lista.forEach(nome => {
                const selecionado = nome === valorSelecionado ? 'selected' : '';
                html += `<option value="${escapeHtml(nome)}" ${selecionado}>${escapeHtml(nome)}</option>`;
            });
            // Se o valor salvo não está (mais) na lista cadastrada (ex.: dado antigo
            // digitado como texto livre antes dessa mudança), mostra mesmo assim.
            if (valorSelecionado && !lista.includes(valorSelecionado)) {
                html += `<option value="${escapeHtml(valorSelecionado)}" selected>${escapeHtml(valorSelecionado)} (não cadastrado)</option>`;
            }
            html += `<option value="__novo__">+ Adicionar novo tipo...</option>`;
            return html;
        };

        // Redesenha todos os selects de Tipo do formulário lateral (pode haver
        // mais de uma "Unidade" adicionada), preservando o valor já escolhido
        // em cada um.
        const renderTipoSelectsInSidebar = () => {
            document.querySelectorAll('#container-list .ct-tipo').forEach(sel => {
                const atual = sel.value === '__novo__' ? '' : sel.value;
                sel.innerHTML = buildTipoOptions(atual);
            });
        };

        // Carrega/observa em tempo real a lista compartilhada de tipos de contêiner.
        const loadTipos = () => {
            const ref = doc(db, "config", "tipos");
            onSnapshot(ref, (snap) => {
                const data = snap.exists() ? snap.data() : {};
                tiposCadastrados = data.lista || [];
                renderTipoSelectsInSidebar();
                if (currentViewingProcessId) {
                    const proc = processes.find(p => p.id === currentViewingProcessId);
                    if (proc) renderModalContent(proc);
                }
                renderRegistryList();
            });
        };

        // Pede o nome do novo tipo e adiciona na lista compartilhada (sem duplicar).
        // Retorna o nome adicionado, ou null se o usuário cancelou.
        window.adicionarNovoTipo = async () => {
            const nome = prompt('Nome do novo tipo de contêiner (ex: 40HC):');
            if (!nome || !nome.trim()) return null;
            const nomeLimpo = nome.trim().slice(0, 150);
            const atual = tiposCadastrados || [];
            if (!atual.includes(nomeLimpo)) {
                const novaLista = [...atual, nomeLimpo].sort((a, b) => a.localeCompare(b, 'pt-BR'));
                const ref = doc(db, "config", "tipos");
                await setDoc(ref, { lista: novaLista }, { merge: true });
            }
            return nomeLimpo;
        };

        // onchange dos selects de Tipo do formulário lateral (novo processo).
        // Cada "Unidade" adicionada tem o seu próprio select (sem id fixo), por
        // isso atualizamos direto pela referência do elemento clicado.
        window.handleTipoSelectForm = async (selectEl) => {
            if (selectEl.value === '__novo__') {
                const novoNome = await window.adicionarNovoTipo();
                renderTipoSelectsInSidebar();
                selectEl.value = novoNome || '';
            }
        };

        // onchange do select de Tipo dentro do modal (contêiner já salvo no processo).
        window.handleTipoSelect = async (selectEl, procId, ctId) => {
            if (selectEl.value === '__novo__') {
                const novoNome = await window.adicionarNovoTipo();
                if (novoNome) {
                    await updateField(procId, ctId, 'tipo', novoNome);
                } else {
                    const proc = processes.find(p => p.id === procId);
                    if (proc) renderModalContent(proc);
                }
            } else {
                await updateField(procId, ctId, 'tipo', selectEl.value);
            }
        };

        // GERENCIAR CADASTROS (editar/excluir itens das listas compartilhadas
        // de terminais, armador e tipo de contêiner). Reaproveita as mesmas
        // funções "adicionarNovoX" já existentes para a parte de adicionar, e
        // usa o índice do item na lista (nunca o texto digitado) nos botões
        // de editar/excluir, evitando qualquer problema com aspas/HTML no nome.
        const REGISTRY_CONFIG = {
            cheio:   { label: 'Terminal de Carregamento', ref: () => doc(db, 'config', 'terminals'), field: 'cheio', getList: () => terminaisCadastrados.cheio || [] },
            vazio:   { label: 'Terminal de Vazio',        ref: () => doc(db, 'config', 'terminals'), field: 'vazio', getList: () => terminaisCadastrados.vazio || [] },
            armador: { label: 'Armador',                  ref: () => doc(db, 'config', 'armadores'), field: 'lista', getList: () => armadoresCadastrados || [] },
            tipo:    { label: 'Tipo de Contêiner',        ref: () => doc(db, 'config', 'tipos'),     field: 'lista', getList: () => tiposCadastrados || [] }
        };
        let currentRegistryTab = 'cheio';

        const writeRegistryList = async (cat, novaLista) => {
            const cfg = REGISTRY_CONFIG[cat];
            await setDoc(cfg.ref(), { [cfg.field]: novaLista }, { merge: true });
        };

        window.openRegistriesModal = () => {
            document.getElementById('registries-modal').classList.remove('hidden');
            document.getElementById('registries-modal').classList.add('flex');
            renderRegistryList();
        };
        window.closeRegistriesModal = () => {
            document.getElementById('registries-modal').classList.add('hidden');
            document.getElementById('registries-modal').classList.remove('flex');
        };
        window.switchRegistryTab = (cat) => {
            currentRegistryTab = cat;
            renderRegistryList();
        };

        // Redesenha a lista de itens da categoria selecionada, com botões de
        // editar/excluir. Chamada tanto ao abrir/trocar de aba quanto sempre
        // que a lista muda em tempo real (via onSnapshot), pra refletir
        // edições feitas por outra pessoa da equipe enquanto o modal está aberto.
        const renderRegistryList = () => {
            const modal = document.getElementById('registries-modal');
            const container = document.getElementById('registries-list-container');
            if (!modal || !container || modal.classList.contains('hidden')) return;

            document.querySelectorAll('.registry-tab-btn').forEach(btn => {
                const ativo = btn.dataset.cat === currentRegistryTab;
                btn.classList.toggle('seg-on', ativo);
                btn.classList.toggle('seg-off', !ativo);
            });

            const cfg = REGISTRY_CONFIG[currentRegistryTab];
            const lista = cfg.getList();
            if (!lista.length) {
                container.innerHTML = `<p class="text-sm text-slate-500 text-center py-6">Nenhum item cadastrado ainda em "${escapeHtml(cfg.label)}".</p>`;
                return;
            }
            const linhas = lista.map((nome, idx) => `
                <div class="flex items-center justify-between gap-2 apple-inset border border-slate-700/60 rounded-xl px-3 py-2">
                    <span class="text-sm text-ink truncate">${escapeHtml(nome)}</span>
                    <div class="flex items-center gap-1 shrink-0">
                        <button onclick="editarItemCadastro('${currentRegistryTab}', ${idx})" title="Editar" class="w-7 h-7 rounded-lg text-slate-400 hover:text-blue-500 hover:bg-slate-500/10 text-xs transition flex items-center justify-center"><i class="fas fa-pen"></i></button>
                        <button onclick="excluirItemCadastro('${currentRegistryTab}', ${idx})" title="Excluir" class="w-7 h-7 rounded-lg text-slate-400 hover:text-red-400 hover:bg-red-500/10 text-xs transition flex items-center justify-center"><i class="fas fa-trash"></i></button>
                    </div>
                </div>`).join('');
            container.innerHTML = `
                <p class="text-[11px] text-slate-500 mb-3 leading-relaxed">Editar ou excluir aqui não altera processos já criados com o valor anterior — eles continuam mostrando o nome antigo, sinalizado como "não cadastrado".</p>
                <div class="space-y-1.5">${linhas}</div>`;
        };

        window.editarItemCadastro = async (cat, idx) => {
            const cfg = REGISTRY_CONFIG[cat];
            const lista = cfg.getList();
            const nomeAntigo = lista[idx];
            if (nomeAntigo === undefined) return;
            const novoNomeRaw = prompt(`Editar "${nomeAntigo}":`, nomeAntigo);
            if (novoNomeRaw === null) return; // cancelado
            const novoNome = novoNomeRaw.trim().slice(0, 150);
            if (!novoNome) { showToast('O nome não pode ficar em branco.', 'error'); return; }
            if (novoNome === nomeAntigo) return;
            if (lista.includes(novoNome)) { showToast(`Já existe um item chamado "${novoNome}".`, 'error'); return; }
            const novaLista = lista.map((n, i) => i === idx ? novoNome : n).sort((a, b) => a.localeCompare(b, 'pt-BR'));
            await writeRegistryList(cat, novaLista);
            showToast(`"${nomeAntigo}" renomeado para "${novoNome}".`);
            renderRegistryList();
        };

        window.excluirItemCadastro = async (cat, idx) => {
            const cfg = REGISTRY_CONFIG[cat];
            const lista = cfg.getList();
            const nome = lista[idx];
            if (nome === undefined) return;
            if (!confirm(`Tem certeza que deseja excluir "${nome}" da lista de ${cfg.label}?`)) return;
            const novaLista = lista.filter((_, i) => i !== idx);
            await writeRegistryList(cat, novaLista);
            showToast(`"${nome}" excluído.`);
            renderRegistryList();
        };

        window.adicionarItemCadastroAtual = async () => {
            let novoNome = null;
            if (currentRegistryTab === 'cheio') novoNome = await window.adicionarNovoTerminal('cheio');
            else if (currentRegistryTab === 'vazio') novoNome = await window.adicionarNovoTerminal('vazio');
            else if (currentRegistryTab === 'armador') novoNome = await window.adicionarNovoArmador();
            else if (currentRegistryTab === 'tipo') novoNome = await window.adicionarNovoTipo();
            if (novoNome) {
                showToast(`"${novoNome}" adicionado.`);
                renderRegistryList();
            }
        };

        // AUTENTICAÇÃO
        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                loginScreen.classList.add('hidden');
                sidebar.classList.remove('hidden');
                mainPanel.classList.remove('hidden');
                document.getElementById('user-display').innerHTML = `<span class="w-5 h-5 rounded-full bg-blue-600 text-white text-[10px] font-semibold flex items-center justify-center">${escapeHtml((user.email || '?').charAt(0).toUpperCase())}</span><span>${escapeHtml(user.email)}</span>`;
                loadProcesses();
                loadTerminais();
                loadArmadores();
                loadTipos();
            } else {
                currentUser = null;
                loginScreen.classList.remove('hidden');
                sidebar.classList.add('hidden');
                mainPanel.classList.add('hidden');
            }
        });

        // Os lembretes de Deadline Draft (3/2/1 dia) dependem só da data/hora
        // atual, não de uma mudança nos dados — então, se alguém deixar o
        // LogiTrack aberto, atualizamos os cards e o modal periodicamente
        // para o aviso "virar de dia" sozinho.
        setInterval(() => {
            if (!currentUser) return;
            renderProcesses();
            if (currentViewingProcessId) {
                const proc = processes.find(p => p.id === currentViewingProcessId);
                if (proc) renderModalContent(proc);
            }
        }, 30 * 60 * 1000);

        // SEGURANÇA: apenas login, sem auto-cadastro. Só entra quem já tem uma
        // conta criada manualmente pelo administrador em Firebase Console >
        // Authentication > Users > Add user. Nenhum novo usuário é criado a
        // partir desta tela.
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('auth-email').value;
            const password = document.getElementById('auth-password').value;
            const errorDiv = document.getElementById('auth-error');
            const btnLogin = document.getElementById('btn-login');

            // Mostra um estado de carregamento no botão enquanto aguarda o
            // Firebase responder, pra não parecer que travou numa internet
            // mais lenta. Restaura o texto original ao final, dando certo ou
            // não (o "finally" garante isso mesmo se der erro).
            const textoOriginalBtn = btnLogin.innerHTML;
            btnLogin.disabled = true;
            btnLogin.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Entrando...';

            try {
                await signInWithEmailAndPassword(auth, email, password);
                errorDiv.classList.add('hidden');
            } catch (error) {
                const semAcesso = ['auth/user-not-found', 'auth/invalid-credential', 'auth/wrong-password'];
                if (semAcesso.includes(error.code)) {
                    errorDiv.innerText = "E-mail ou senha incorretos, ou esta conta ainda não foi cadastrada pelo administrador.";
                } else {
                    errorDiv.innerText = "Erro no login: " + error.message;
                }
                errorDiv.classList.remove('hidden');
            } finally {
                btnLogin.disabled = false;
                btnLogin.innerHTML = textoOriginalBtn;
            }
        });

        document.getElementById('btn-logout').addEventListener('click', () => signOut(auth));

        // ALTERNAR ABAS E TIPOS NO FORMULÁRIO
        const setFormType = (type) => {
            document.getElementById('process-type').value = type;
            const btnImport = document.getElementById('btn-type-import');
            const btnExport = document.getElementById('btn-type-export');
            const fImportDoc = document.getElementById('fields-import-doc');
            const fImportTerminals = document.getElementById('fields-import-terminals');
            const fExport = document.getElementById('fields-export');

            document.getElementById('container-list').innerHTML = '';
            addContainerField(type); // Adiciona 1 opcional por padrão

            if (type === 'import') {
                btnImport.className = 'flex-1 py-[7px] text-[13px] font-semibold rounded-[9px] seg-on transition-all duration-200';
                btnExport.className = 'flex-1 py-[7px] text-[13px] font-semibold rounded-[9px] seg-off transition-all duration-200';
                fImportDoc.classList.remove('hidden');
                fImportTerminals.classList.remove('hidden');
                fExport.classList.add('hidden');
            } else {
                btnExport.className = 'flex-1 py-[7px] text-[13px] font-semibold rounded-[9px] seg-on transition-all duration-200';
                btnImport.className = 'flex-1 py-[7px] text-[13px] font-semibold rounded-[9px] seg-off transition-all duration-200';
                fExport.classList.remove('hidden');
                fImportDoc.classList.add('hidden');
                fImportTerminals.classList.add('hidden');
            }
        };

        document.getElementById('btn-type-import').addEventListener('click', () => setFormType('import'));
        document.getElementById('btn-type-export').addEventListener('click', () => setFormType('export'));

        const setMainTab = (tab) => {
            currentActiveTab = tab;
            const tabs = {
                'import': document.getElementById('tab-import'),
                'export': document.getElementById('tab-export'),
                'archive': document.getElementById('tab-archive')
            };
            
            // IMPORTANTE: manter "flex-1 sm:flex-none sm:px-5 shrink-0 text-center" igual ao
            // que já vem no HTML original — sem isso, no celular os botões
            // perdiam o alinhamento certo depois do primeiro clique e a aba
            // ficava difícil/impossível de tocar.
            Object.values(tabs).forEach(t => t.className = 'flex-1 sm:flex-none sm:px-5 shrink-0 text-center text-[13px] font-semibold rounded-[9px] py-[7px] seg-off transition-all duration-200');

            if (tab === 'archive') {
                tabs[tab].className = 'flex-1 sm:flex-none sm:px-5 shrink-0 text-center text-[13px] font-semibold rounded-[9px] py-[7px] seg-on transition-all duration-200';
            } else {
                tabs[tab].className = 'flex-1 sm:flex-none sm:px-5 shrink-0 text-center text-[13px] font-semibold rounded-[9px] py-[7px] seg-on transition-all duration-200';
            }
            renderProcesses();
        };

        document.getElementById('tab-import').addEventListener('click', () => setMainTab('import'));
        document.getElementById('tab-export').addEventListener('click', () => setMainTab('export'));
        document.getElementById('tab-archive').addEventListener('click', () => setMainTab('archive'));

        // BUSCA RÁPIDA de processos (armador, motorista, placa, doc/booking, nº do contêiner)
        window.filterProcesses = (valor) => {
            searchQuery = (valor || '').toLowerCase().trim();
            const btnClear = document.getElementById('btn-clear-search');
            if (searchQuery) {
                btnClear.classList.remove('hidden');
                btnClear.classList.add('flex');
            } else {
                btnClear.classList.add('hidden');
                btnClear.classList.remove('flex');
            }
            renderProcesses();
        };

        window.clearSearch = () => {
            const input = document.getElementById('search-processos');
            input.value = '';
            window.filterProcesses('');
            input.focus();
        };

        // GESTÃO DE CONTAINERS NO FORMULÁRIO LATERAL (OPCIONALIDADE)
        let containerCount = 0;
        const addContainerField = (type = document.getElementById('process-type').value) => {
            containerCount++;
            const div = document.createElement('div');
            div.className = 'bg-navy-900 p-3 rounded-lg border border-slate-700 relative';
            div.id = `ct-form-${containerCount}`;

            let html = `
                <div class="flex justify-between items-center mb-3">
                    <span class="text-[10px] font-semibold text-slate-400 uppercase tracking-[0.1em]">Unidade ${containerCount}</span>
                    <button type="button" onclick="document.getElementById('ct-form-${containerCount}').remove()" class="w-6 h-6 rounded-md text-slate-500 hover:text-red-400 hover:bg-red-500/10 text-xs transition flex items-center justify-center"><i class="fas fa-trash"></i></button>
                </div>
                <div class="grid grid-cols-2 gap-3 mb-2">
                    <div>
                        <input type="text" placeholder="ABCD 123.456-7" maxlength="15" oninput="maskContainerNumero(this)" class="ct-num apple-input-sm w-full">
                        <p class="ct-num-warning hidden text-[10px] text-red-400 mt-1 leading-tight">Dígito verificador não confere.</p>
                    </div>
                    <select onchange="handleTipoSelectForm(this)" class="ct-tipo apple-input-sm w-full">${buildTipoOptions('')}</select>
                </div>`;
                
            div.innerHTML = html;
            document.getElementById('container-list').appendChild(div);
        };
        
        document.getElementById('btn-add-container').addEventListener('click', () => addContainerField());
        addContainerField('import'); 

        // SALVAR NOVO PROCESSO
        document.getElementById('process-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const type = document.getElementById('process-type').value;
            
            let processData = {
                userId: currentUser.uid,
                type: type,
                status: 'active',
                createdAt: new Date().toISOString(),
                armador: document.getElementById('f-armador').value,
                motorista: document.getElementById('f-motorista').value,
                placas: document.getElementById('f-placas').value,
                observacoes: document.getElementById('f-observacoes').value,
                containers: []
            };

            if (type === 'import') {
                processData.importador = document.getElementById('f-importador').value;
                processData.documentoTipo = document.getElementById('f-documento-tipo').value;
                processData.documentoNumero = document.getElementById('f-documento-numero').value;
                processData.termCarga = document.getElementById('f-term-carga').value;
                processData.termVazio = document.getElementById('f-term-vazio').value;
                // 'devolucao' (padrão) = tem Agendamento de Vazio no checklist;
                // 'baixa' = contêiner não volta pro terminal, então essa etapa
                // do checklist nem aparece (ver importChecklistSteps mais abaixo).
                processData.finalizacaoVazio = document.getElementById('f-finalizacao-vazio').value || 'devolucao';
            } else {
                processData.exportador = document.getElementById('f-exportador').value;
                processData.referencia = document.getElementById('f-referencia').value;
                processData.booking = document.getElementById('f-booking').value;
                processData.navio = document.getElementById('f-navio').value;
            }

            const ctForms = document.querySelectorAll('#container-list > div');
            ctForms.forEach((ctDiv, index) => {
                let numero = ctDiv.querySelector('.ct-num').value.trim();
                let tipo = ctDiv.querySelector('.ct-tipo').value.trim();
                
                // Salva mesmo se vazio, pois no modal o usuário vai editar depois
                let ct = {
                    id: `c_${Date.now()}_${index}`,
                    numero: numero,
                    tipo: tipo,
                    checklist: {} 
                };
                
                if (type === 'import') {
                    ct.checklist = novoChecklistImport();
                } else {
                    ct.tara = '';
                    ct.lacre = '';
                    ct.deadlineDraft = '';
                    ct.deadlineCarga = '';
                    ct.agVazio = '';
                    ct.termVazioExp = '';
                    ct.agCheio = '';
                    ct.termCheioExp = '';
                }
                processData.containers.push(ct);
            });

            // VERIFICAÇÃO DE DUPLICIDADE: avisa (sem bloquear, pois pode ser
            // intencional) quando o número de contêiner, o documento (DI/DTA/
            // DUIMP) ou o booking já aparecem em outro processo ativo. A
            // checagem só enxerga os processos do próprio usuário logado, que
            // é o mesmo recorte que as regras de segurança do Firestore já
            // permitem ler.
            const numerosNovos = processData.containers.map(c => c.numero).filter(Boolean);
            const processosAtivos = processes.filter(p => p.status !== 'archived');
            const containerDuplicado = numerosNovos.find(numero =>
                processosAtivos.some(p => (p.containers || []).some(c => c.numero === numero))
            );
            let documentoDuplicado = null;
            if (type === 'import' && processData.documentoNumero) {
                const existeDoc = processosAtivos.some(p => p.type === 'import' && p.documentoNumero === processData.documentoNumero);
                if (existeDoc) documentoDuplicado = `o número de documento "${processData.documentoNumero}"`;
            } else if (type === 'export' && processData.booking) {
                const existeBooking = processosAtivos.some(p => p.type === 'export' && p.booking === processData.booking);
                if (existeBooking) documentoDuplicado = `o número de booking "${processData.booking}"`;
            }
            if (containerDuplicado || documentoDuplicado) {
                const motivos = [];
                if (containerDuplicado) motivos.push(`o número de contêiner "${containerDuplicado}"`);
                if (documentoDuplicado) motivos.push(documentoDuplicado);
                if (!confirm(`Já existe um processo ativo usando ${motivos.join(' e ')}. Deseja criar mesmo assim?`)) {
                    return;
                }
            }

            try {
                await addDoc(collection(db, "processes"), processData);
                document.getElementById('process-form').reset();
                document.getElementById('container-list').innerHTML = '';
                containerCount = 0;
                setMainTab(type); // Muda para a aba correspondente para ver o processo criado
                closeSidebarMobile(); // no celular, fecha a gaveta do menu após criar (sem efeito no desktop)
                showToast('Processo criado com sucesso.');
            } catch (error) {
                console.error("Erro ao salvar:", error);
                alert("Erro ao criar processo.");
            }
        });

        // Placeholders "pulsando" mostrados só entre o login e a primeira
        // resposta do Firestore, pra tela não ficar em branco enquanto
        // carrega. Assim que os dados chegam, renderProcesses() substitui
        // esse conteúdo pelos cards de verdade.
        const renderProcessesSkeleton = () => {
            const container = document.getElementById('processes-container');
            if (!container) return;
            const skeletonCard = `
                <div class="apple-card p-5 animate-pulse">
                    <div class="flex flex-col sm:flex-row sm:items-center gap-4 sm:gap-6 w-full">
                        <div class="sm:w-1/3 min-w-0 space-y-2.5">
                            <div class="h-2.5 w-16 bg-navy-700 rounded-full"></div>
                            <div class="h-4 w-32 bg-navy-700 rounded-full"></div>
                            <div class="h-2.5 w-24 bg-navy-700 rounded-full"></div>
                        </div>
                        <div class="sm:w-1/3 min-w-0 space-y-2.5 border-t sm:border-t-0 sm:border-l border-slate-700/60 pt-3 sm:pt-0 sm:pl-6">
                            <div class="h-2.5 w-20 bg-navy-700 rounded-full"></div>
                            <div class="h-4 w-28 bg-navy-700 rounded-full"></div>
                        </div>
                        <div class="sm:w-1/3 flex flex-col items-start sm:items-end space-y-2.5">
                            <div class="h-2.5 w-16 bg-navy-700 rounded-full"></div>
                            <div class="h-5 w-24 bg-navy-700 rounded-full"></div>
                        </div>
                    </div>
                    <div class="mt-4 pt-3 border-t border-slate-700/50">
                        <div class="h-1.5 w-full bg-navy-700 rounded-full"></div>
                    </div>
                </div>`;
            container.innerHTML = skeletonCard.repeat(3);
        };

        // LER DO FIREBASE
        const loadProcesses = () => {
            renderProcessesSkeleton();
            const q = query(collection(db, "processes"), where("userId", "==", currentUser.uid));
            onSnapshot(q, (snapshot) => {
                processes = [];
                snapshot.forEach((doc) => {
                    processes.push({ id: doc.id, ...doc.data() });
                });
                renderProcesses();
                
                // Mantém o modal atualizado em tempo real se estiver aberto
                if(currentViewingProcessId) {
                    const updatedData = processes.find(p => p.id === currentViewingProcessId);
                    if(updatedData) renderModalContent(updatedData);
                }
            });
        };

        // LEMBRETE DE DEADLINE DRAFT (só exportação, só o prazo do Draft, que é
        // o mais importante). Olha a data/hora mais próxima entre todos os
        // contêineres do processo e devolve um aviso quando faltam 3, 2 ou 1
        // dia — ou quando já passou do prazo.
        const draftAlertConfig = {
            aviso:    { box: 'bg-yellow-900/15 border-yellow-500', icon: 'fa-clock', iconColor: 'text-yellow-500', text: 'text-yellow-500', badge: 'bg-yellow-900/10 text-yellow-500 border border-yellow-600/40' },
            atencao:  { box: 'bg-blue-900/10 border-blue-400', icon: 'fa-clock', iconColor: 'text-blue-400', text: 'text-blue-400', badge: 'bg-blue-900/10 text-blue-400 border border-blue-400/40' },
            urgente:  { box: 'bg-blue-900/15 border-blue-600', icon: 'fa-triangle-exclamation', iconColor: 'text-blue-600', text: 'text-blue-600', badge: 'bg-blue-900/15 text-blue-600 border border-blue-600/50' },
            atrasado: { box: 'bg-blue-900/20 border-blue-900', icon: 'fa-triangle-exclamation', iconColor: 'text-blue-900', text: 'text-blue-900', badge: 'bg-blue-900/20 text-blue-900 border border-blue-900/50' }
        };

        // Um contêiner é considerado "com o Draft já cumprido" quando já tem
        // Numeração, Tara e Lacre preenchidos — nesse ponto o lembrete não
        // faz mais sentido pra ele, mesmo que o Deadline Draft esteja perto
        // ou já tenha passado.
        const draftJaCumprido = (ct) => {
            return !!((ct.numero || '').trim() && (ct.tara || '').trim() && (ct.lacre || '').trim());
        };

        const getDraftDeadlineInfo = (proc) => {
            if (proc.type !== 'export' || proc.status !== 'active' || !proc.containers) return null;

            let maisProxima = null;
            proc.containers.forEach(ct => {
                if (!ct.deadlineDraft || draftJaCumprido(ct)) return;
                const data = new Date(ct.deadlineDraft);
                if (isNaN(data.getTime())) return;
                if (!maisProxima || data < maisProxima) maisProxima = data;
            });
            if (!maisProxima) return null;

            const diffMs = maisProxima.getTime() - Date.now();

            if (diffMs <= 0) {
                const diasAtraso = Math.floor(-diffMs / 86400000);
                return {
                    nivel: 'atrasado',
                    texto: diasAtraso > 0 ? `Draft atrasado há ${diasAtraso} dia${diasAtraso > 1 ? 's' : ''}` : 'Draft venceu hoje'
                };
            }

            const diasRestantes = Math.ceil(diffMs / 86400000);
            if (diasRestantes > 3) return null;

            const textos = { 1: 'Draft vence em 1 dia', 2: 'Draft vence em 2 dias', 3: 'Draft vence em 3 dias' };
            const nivel = diasRestantes === 1 ? 'urgente' : (diasRestantes === 2 ? 'atencao' : 'aviso');
            return { nivel, texto: textos[diasRestantes] };
        };

        // Calcula o progresso (0-100) de um processo, para a barrinha do card.
        // Importação: conta as etapas do checklist (checkboxes + os checkmarks de
        // agendamento) marcadas como concluídas, em todos os contêineres.
        // Exportação: conta os campos de prazo/agendamento preenchidos.
        const getProcessProgress = (proc) => {
            if (!proc.containers || proc.containers.length === 0) return 0;
            let total = 0, done = 0;

            if (proc.type === 'import') {
                proc.containers.forEach(ct => {
                    stepsChecklistImport(proc).forEach(step => {
                        total++;
                        if (step.type === 'checkbox') {
                            if (ct.checklist && ct.checklist[step.id] === 'true') done++;
                        } else if (step.type === 'datetime') {
                            if (ct.checklist && ct.checklist[`${step.id}_check`] === 'true') done++;
                        }
                    });
                });
            } else {
                const exportFields = ['deadlineDraft', 'deadlineCarga', 'agVazio', 'agCheio'];
                proc.containers.forEach(ct => {
                    exportFields.forEach(f => {
                        total++;
                        if (ct[f]) done++;
                    });
                });
            }

            return total === 0 ? 0 : Math.round((done / total) * 100);
        };

        // RESUMO NO TOPO: sempre contando só a aba selecionada no momento
        // (nunca importação + exportação misturados), já que o prazo de
        // Draft só existe pra exportação — não faria sentido aparecer no
        // resumo de Importações. Reaproveita getDraftDeadlineInfo, a mesma
        // função que já alimenta o aviso dentro de cada processo.
        const renderResumo = () => {
            const bar = document.getElementById('resumo-bar');
            const boxPrazo = document.getElementById('resumo-prazo-box');
            const boxAtraso = document.getElementById('resumo-atraso-box');
            const elLabelTotal = document.getElementById('resumo-total-label');
            const elTotal = document.getElementById('resumo-total');
            const elPrazo = document.getElementById('resumo-prazo');
            const elAtraso = document.getElementById('resumo-atraso');
            if (!bar) return;

            if (currentActiveTab === 'archive') {
                elLabelTotal.textContent = 'Arquivados';
                elTotal.textContent = processes.filter(p => p.status === 'archived').length;
                bar.className = 'grid grid-cols-1 gap-2.5 sm:gap-4 mb-4';
                boxPrazo.classList.add('hidden');
                boxAtraso.classList.add('hidden');
                return;
            }

            // Só exportação tem prazo de Draft, então os cartões de "Prazo
            // próximo" e "Atrasados" só aparecem na aba de Exportações.
            const isExport = currentActiveTab === 'export';
            elLabelTotal.textContent = isExport ? 'Exportações em andamento' : 'Importações em andamento';

            const relevantes = processes.filter(p => p.status === 'active' && p.type === currentActiveTab);
            elTotal.textContent = relevantes.length;

            if (!isExport) {
                bar.className = 'grid grid-cols-1 gap-2.5 sm:gap-4 mb-4';
                boxPrazo.classList.add('hidden');
                boxAtraso.classList.add('hidden');
                return;
            }

            bar.className = 'grid grid-cols-3 gap-2.5 sm:gap-4 mb-4';
            boxPrazo.classList.remove('hidden');
            boxAtraso.classList.remove('hidden');

            let prazoProximo = 0, atrasados = 0;
            relevantes.forEach(proc => {
                const info = getDraftDeadlineInfo(proc);
                if (!info) return;
                if (info.nivel === 'atrasado') atrasados++;
                else prazoProximo++;
            });
            elPrazo.textContent = prazoProximo;
            elAtraso.textContent = atrasados;
        };

        // RENDERIZAR CARTÕES (TELA PRINCIPAL)
        const renderProcesses = () => {
            renderResumo();
            const container = document.getElementById('processes-container');
            container.innerHTML = '';

            // Desfaz a instância de arrastar-e-soltar do render anterior (se
            // houver) antes de montar os cards de novo.
            if (cardSortable) {
                cardSortable.destroy();
                cardSortable = null;
            }

            let filtered = processes.filter(p => {
                if(currentActiveTab === 'archive') return p.status === 'archived';
                if(currentActiveTab === 'import') return p.status === 'active' && p.type === 'import';
                if(currentActiveTab === 'export') return p.status === 'active' && p.type === 'export';
                return false;
            });

            // Busca rápida: procura o termo digitado em armador, motorista,
            // placas, importador/exportador, documento/booking/referência/navio
            // e nos números de contêiner do processo.
            if (searchQuery) {
                filtered = filtered.filter(proc => {
                    const campos = [
                        proc.armador, proc.motorista, proc.placas,
                        proc.importador, proc.exportador,
                        proc.documentoNumero, proc.documento, proc.booking, proc.referencia, proc.navio,
                        proc.observacoes,
                        ...(proc.containers || []).map(c => c.numero)
                    ].filter(Boolean).join(' ').toLowerCase();
                    return campos.includes(searchQuery);
                });
            }

            if(filtered.length === 0) {
                const mensagem = searchQuery
                    ? `Nenhum processo encontrado para "${escapeHtml(document.getElementById('search-processos').value)}".`
                    : 'Nenhum processo encontrado nesta visão.';
                container.innerHTML = `
                    <div class="text-center py-16 px-6 text-slate-500 apple-inset rounded-2xl border border-dashed border-slate-600/70">
                        <i class="fas fa-inbox text-2xl text-slate-500/70 mb-3"></i>
                        <p class="text-sm">${mensagem}</p>
                    </div>`;
                return;
            }

            filtered.sort((a,b) => new Date(b.createdAt) - new Date(a.createdAt));

            // Aplica a ordem escolhida pelo usuário (se ele já arrastou algum
            // card antes). Quem não tem posição salva continua ordenado por
            // data (o sort acima), aparecendo depois de quem já foi arrastado
            // — o sort do JS é estável, então essa ordem relativa é preservada.
            const ordemSalva = getCardOrder();
            const sortableAtivo = !searchQuery && currentActiveTab !== 'archive';
            if (sortableAtivo && ordemSalva.length) {
                const indice = new Map(ordemSalva.map((id, i) => [id, i]));
                filtered.sort((a, b) => {
                    const ai = indice.has(a.id) ? indice.get(a.id) : Infinity;
                    const bi = indice.has(b.id) ? indice.get(b.id) : Infinity;
                    return ai - bi;
                });
            }

            filtered.forEach(proc => {
                const title = proc.type === 'import' ? proc.importador : proc.exportador;
                const docRef = proc.type === 'import'
                    ? (proc.documentoTipo ? `${proc.documentoTipo}: ${proc.documentoNumero || ''}` : proc.documento)
                    : proc.booking;
                
                // Conta apenas contêineres que já têm número preenchido (ou mostra vazio)
                const validContainers = proc.containers.filter(c => c.numero !== '');
                const countBadgeText = validContainers.length > 0 ? `${validContainers.length} Unid.` : 'Pendente';
                
                const badges = validContainers.slice(0, 3).map(c => `<span class="apple-inset border border-slate-600/60 text-slate-300 text-xs px-2.5 py-1 rounded-full">${escapeHtml(c.numero)}${c.tipo ? ' <span class="text-slate-500">· ' + escapeHtml(c.tipo) + '</span>' : ''}</span>`).join(' ');
                const extraBadges = validContainers.length > 3 ? `<span class="text-xs text-slate-500 px-1">+${validContainers.length - 3}</span>` : '';

                const draftInfo = getDraftDeadlineInfo(proc);
                const draftBadge = draftInfo
                    ? `<div class="inline-flex items-center gap-1.5 mt-2 px-2 py-1 rounded-full text-[10px] font-semibold ${draftAlertConfig[draftInfo.nivel].badge}"><i class="fas ${draftAlertConfig[draftInfo.nivel].icon}"></i>${escapeHtml(draftInfo.texto)}</div>`
                    : '';

                const obsBadge = (proc.observacoes && proc.observacoes.trim())
                    ? `<div class="inline-flex items-center gap-1.5 mt-2 px-2 py-1 rounded-full text-[10px] font-semibold bg-slate-500/10 text-slate-500 border border-slate-600/40" title="${escapeHtml(proc.observacoes)}"><i class="fas fa-note-sticky"></i>Observação</div>`
                    : '';

                // Agendamento de Carregamento (só existe no checklist de
                // importação, e é por contêiner): mostra o mais próximo entre
                // os contêineres do processo, se algum já estiver preenchido.
                const agCargaValores = proc.type === 'import'
                    ? proc.containers.map(c => c.checklist && c.checklist.ag_carga).filter(Boolean).sort()
                    : [];
                const agCargaTexto = agCargaValores.length > 0 ? formatarDataHoraCurta(agCargaValores[0]) : null;
                const agCargaInfo = agCargaTexto
                    ? `<div class="text-xs text-slate-500 mt-1"><i class="fas fa-calendar-check mr-1.5 opacity-50 w-3 inline-block"></i>Carreg.: ${escapeHtml(agCargaTexto)}</div>`
                    : '';

                const progress = getProcessProgress(proc);
                const progressDone = progress === 100;
                const progressColor = progressDone ? 'bg-emerald-500' : 'bg-blue-500';

                // Faixa colorida na borda esquerda do card, pra dar pra
                // escanear o status de cada processo de relance, sem precisar
                // ler o card inteiro. Reaproveita as mesmas cores já usadas
                // no aviso de Deadline Draft e na barra de progresso, então
                // não introduz nenhum tom novo no app.
                const draftBorderMap = {
                    aviso: 'border-l-yellow-500',
                    atencao: 'border-l-blue-400',
                    urgente: 'border-l-blue-600',
                    atrasado: 'border-l-blue-900'
                };
                let statusBorderClass = 'border-l-blue-500'; // padrão: em andamento
                if (proc.status === 'archived') {
                    statusBorderClass = 'border-l-slate-600';
                } else if (draftInfo) {
                    statusBorderClass = draftBorderMap[draftInfo.nivel] || statusBorderClass;
                } else if (progressDone) {
                    statusBorderClass = 'border-l-emerald-500';
                }

                const card = document.createElement('div');
                card.className = `relative apple-card p-5 border-l-4 ${statusBorderClass} cursor-pointer hover:shadow-apple-hover hover:-translate-y-0.5 transition-all duration-200 ease-out group`;
                card.dataset.processId = proc.id;
                card.onclick = () => openModal(proc.id);

                card.innerHTML = `
                    ${sortableAtivo ? `<div class="card-drag-handle absolute top-2 right-2 w-6 h-6 flex items-center justify-center rounded-md text-slate-500 hover:text-slate-300 hover:bg-navy-900/60 cursor-grab active:cursor-grabbing transition-colors z-10" onclick="event.stopPropagation()" title="Arrastar para reordenar"><i class="fas fa-grip-vertical text-xs"></i></div>` : ''}
                    <div class="flex flex-col sm:flex-row sm:items-center gap-4 sm:gap-6 w-full ${sortableAtivo ? 'sm:pr-8' : ''}">
                        <div class="sm:w-1/3 min-w-0">
                            <div class="text-[10px] text-blue-500 font-semibold uppercase tracking-[0.1em] mb-1">${proc.type === 'import' ? 'Importação' : 'Exportação'}</div>
                            <div class="font-semibold text-ink text-[17px] truncate group-hover:text-blue-500 transition-colors">${escapeHtml(title) || 'Sem Nome'}</div>
                            <div class="text-xs text-slate-400 mt-1.5"><i class="fas fa-ship mr-1.5 opacity-50 w-3 inline-block"></i>${escapeHtml(proc.armador) || 'N/A'}</div>
                            <div class="text-xs text-slate-500 mt-1"><i class="fas fa-id-badge mr-1.5 opacity-50 w-3 inline-block"></i>${escapeHtml(proc.motorista) || 'Motorista N/D'} <span class="mx-1 opacity-40">•</span><i class="fas fa-truck mr-1.5 opacity-50 w-3 inline-block"></i>${escapeHtml(proc.placas) || 'Placas N/D'}</div>
                            ${agCargaInfo}
                            ${draftBadge}
                            ${obsBadge}
                        </div>
                        <div class="sm:w-1/3 min-w-0 border-t sm:border-t-0 sm:border-l border-slate-700/60 pt-3 sm:pt-0 sm:pl-6">
                            <div class="text-[10px] text-slate-500 font-semibold uppercase tracking-[0.1em] mb-1">Doc / Booking</div>
                            <div class="font-semibold text-slate-200 text-base">${escapeHtml(docRef) || 'Aguardando'}</div>
                        </div>
                        <div class="sm:w-1/3 flex flex-col items-start sm:items-end">
                            <div class="text-[10px] text-slate-500 font-semibold uppercase tracking-[0.1em] mb-2">${countBadgeText}</div>
                            <div class="flex flex-wrap gap-1.5 sm:justify-end">${badges} ${extraBadges}</div>
                        </div>
                    </div>
                    <div class="mt-4 pt-3 border-t border-slate-700/50">
                        <div class="flex items-center justify-between mb-1.5">
                            <span class="text-[10px] text-slate-500 font-semibold uppercase tracking-[0.1em]">Progresso</span>
                            <span class="text-[10px] font-semibold flex items-center gap-1 tabular-nums ${progressDone ? 'text-emerald-400' : 'text-slate-400'}">${progressDone ? '<i class="fas fa-circle-check"></i>' : ''}${progress}%</span>
                        </div>
                        <div class="w-full h-1.5 bg-slate-500/15 rounded-full overflow-hidden">
                            <div class="h-full ${progressColor} rounded-full transition-all duration-500 ease-out" style="width:${progress}%"></div>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });

            // Ativa o arrastar-e-soltar (só na visão normal, sem busca e fora
            // do arquivo — ver "sortableAtivo" acima). O handle (ícone de
            // grade no canto do card) evita que arrastar dispare o clique
            // que abre o modal do processo.

            headerEditArea.innerHTML = proc.type === 'import' ? `

                            <input type="text" placeholder="Lacre" value="${escapeHtml(ct.lacre)}" onchange="updateField('${proc.id}', '${ct.id}', 'lacre', this.value)" ${proc.status === 'archived' ? 'disabled' : ''} class="apple-input">

                    ctBody = `<div class="space-y-2.5">`;
                    stepsChecklistImport(proc).forEach(step => {
                        const val = ct.checklist[step.id] || '';
