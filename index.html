<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LogiTrack Pro - Gestão Logística</title>

    <!-- Aplica o tema salvo (claro/escuro e cor de destaque) ANTES de qualquer
         estilo carregar, pra tela não "piscar" no tema errado ao abrir o app.
         A lista de cores é a de src/lib/temas.js (sem o vermelho, que é o padrão).
         Mudou este script? Atualize o hash da CSP no vercel.json (há um teste). -->
    <script>
      (function () {
        try {
          var root = document.documentElement;
          if (localStorage.getItem('logitrack-theme') === 'dark') {
            root.setAttribute('data-theme', 'dark');
          }
          var cor = localStorage.getItem('logitrack-accent');
          if (/^(azul|petroleo|laranja|grafite)$/.test(cor)) {
            root.setAttribute('data-accent', cor);
          }
        } catch (e) {}
      })();
    </script>

    <!-- PWA: instalável no celular/desktop (ícone, tela cheia, cor do tema) -->
    <meta name="theme-color" content="#B10004" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="LogiTrack" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />

  </head>
  <body class="bg-navy-900 text-slate-300 font-sans antialiased">
    <!-- Tela de abertura estática (igual ao componente Splash): aparece na hora,
         antes do JavaScript carregar, e o React a substitui ao iniciar. -->
    <div id="root"><div class="flex h-dvh flex-col items-center justify-center gap-5 bg-navy-900">
      <div class="relative flex size-16 items-center justify-center overflow-hidden rounded-[18px] bg-gradient-to-b from-[#e2232b] to-[#a80008] text-white shadow-[0_1px_2px_rgb(0_0_0/0.2),inset_0_0.5px_0_rgb(255_255_255/0.35)]">
        <svg class="size-8" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 18V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v11a1 1 0 0 0 1 1h2"/><path d="M15 18H9"/><path d="M19 18h2a1 1 0 0 0 1-1v-3.65a1 1 0 0 0-.22-.624l-3.48-4.35A1 1 0 0 0 17.52 8H14"/><circle cx="17" cy="18" r="2"/><circle cx="7" cy="18" r="2"/></svg>
      </div>
      <div class="text-center">
        <div class="font-display text-[22px] font-bold tracking-[-0.02em] text-ink">LogiTrack</div>
        <div class="mt-0.5 text-[13px] text-slate-500">Transportes Imigrantes</div>
      </div>
      <div class="splash-bar"></div>
    </div></div>
    <!-- Área usada só na impressão (Exportar PDF), ver index.css -->
    <div id="print-area"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
