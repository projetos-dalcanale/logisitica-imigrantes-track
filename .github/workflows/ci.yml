# Verificação automática: roda em todo Pull Request e em cada push no main e
# no teste. O main exige que ela passe antes do merge (proteção de branch).
name: Verificação

on:
  pull_request:
  push:
    branches: [main, teste]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Lint, testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Testes
        run: npm test
      - name: Build
        run: npm run build
