# Verificação automática: roda em todo Pull Request e em cada push no main e
# no teste. O main exige que ela passe antes do merge (proteção de branch).
# Inclui os testes de tela (e2e/): o app abre num navegador de verdade,
# ligado ao emulador do Firebase (dados fictícios, nada de produção).
name: Verificação

on:
  pull_request:
  push:
    branches: [main, teste]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Lint, testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Testes
        run: npm test
      - name: Build
        run: npm run build

      # ---- Testes de tela ----
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Guardar os emuladores do Firebase entre execuções
        uses: actions/cache@v6
        with:
          path: ~/.cache/firebase/emulators
          key: emuladores-firebase-v1
      # Playwright, firebase-tools e firebase-admin são devDependencies com
      # versão fixa: o `npm ci` já instalou tudo pelo package-lock.json. Não
      # rodar `npm install` aqui, senão o npm recalcula a árvore inteira e pode
      # pegar versões recém-publicadas (já quebrou assim).
      - name: Preparar testes de tela
        run: npx playwright install --with-deps chromium
      - name: Testes de tela
        run: npm run e2e
      - name: Relatório dos testes de tela (só quando falham)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: relatorio-testes-de-tela
          path: playwright-report
          retention-days: 7
