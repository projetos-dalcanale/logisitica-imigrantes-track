# Verificação automática: roda em todo Pull Request e em cada push no main e
# no teste. O main exige que ela passe antes do merge (proteção de branch).
# Inclui os testes de tela (e2e/): o app abre num navegador de verdade,
# ligado ao emulador do Firebase (dados fictícios, nada de produção).
name: Verificação

on:
  pull_request:
  push:
    branches: [main, teste]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Lint, testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Testes
        run: npm test
      - name: Build
        run: npm run build

      # ---- Testes de tela ----
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Guardar os emuladores do Firebase entre execuções
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: emuladores-firebase-v1
      - name: Preparar testes de tela
        run: |
          npm install --no-save --no-package-lock @playwright/test@1 firebase-tools@latest firebase-admin@13
          npx playwright install --with-deps chromium
      - name: Testes de tela
        run: npx firebase emulators:exec --only auth,firestore --project demo-logitrack "npx playwright test -c e2e/playwright.config.js"
      - name: Relatório dos testes de tela (só quando falham)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: relatorio-testes-de-tela
          path: playwright-report
          retention-days: 7
